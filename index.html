<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    function isMobile() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i
        .test(navigator.userAgent) || window.innerWidth <= 768;
    }

    window.onload = function() {
      if (isMobile()) {
        window.location.href = "caked_by_abi_mobile.html";
      } else {
        window.location.href = "caked_by_abi.html";
      }
    };
  </script>
</head>
<body>
  <p>Redirecting you to the best version for your device...</p>
</body>
</html>
